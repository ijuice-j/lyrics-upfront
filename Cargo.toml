[package]
name = "lyrics-upfront"
version = "2.0.0"
edition = "2021"
description = "Lyrics UpFront: synced lyrics overlay for Spotify on Windows"
license = "MIT"
repository = "https://github.com/ijuice-j/lyrics-upfront"

# Every dependency is pure Rust; graphics, text, images, HTTPS and media info
# all come from Windows itself, so nothing large is bundled.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex-lite = "0.1"
sha1_smol = "1"

[dependencies.windows]
version = "0.58"
features = [
    "Foundation",
    "Foundation_Collections",
    "Foundation_Numerics",
    "Media_Control",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
